<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitar Jam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Guitar Jam</h1>
  </header>

  <main>

    <!-- Key + Progression -->
    <section class="section row-spaced">
      <div class="control-group">
        <div class="ctrl-label">Key</div>
        <select id="key-select" class="key-select">
          <option>C</option><option>C#</option><option>D</option>
          <option>D#</option><option selected>E</option><option>F</option>
          <option>F#</option><option>G</option><option>G#</option>
          <option>A</option><option>A#</option><option>B</option>
        </select>
      </div>
      <div class="control-group">
        <div class="ctrl-label">Progression</div>
        <div class="seg-control" id="prog-ctrl">
          <button class="seg active" data-prog="I-IV-V">I–IV–V</button>
          <button class="seg" data-prog="12-bar">12-bar</button>
          <button class="seg" data-prog="I-V-vi-IV">I–V–vi–IV</button>
        </div>
      </div>
    </section>

    <!-- Chord diagrams for current key + progression -->
    <section class="section">
      <div id="chord-display" class="chord-row"></div>
    </section>

    <!-- Currently playing -->
    <div class="now-playing">
      <span class="now-label">Now playing</span>
      <span id="now-chord">—</span>
    </div>

    <!-- Style -->
    <section class="section">
      <div class="ctrl-label">Style</div>
      <div class="seg-control four-wide" id="groove-ctrl">
        <button class="seg active" data-groove="rock">Rock</button>
        <button class="seg" data-groove="blues">Blues</button>
        <button class="seg" data-groove="reggae">Reggae</button>
        <button class="seg" data-groove="funk">Funk</button>
      </div>
    </section>

    <!-- BPM + beat indicator -->
    <section class="section">
      <div class="bpm-row">
        <div class="bpm-display">
          <span id="bpm-number">120</span>
          <span class="bpm-unit">BPM</span>
        </div>
        <input type="range" id="bpm-slider" class="bpm-slider" min="40" max="200" value="120">
        <button id="tap-btn" class="tap-btn">Tap</button>
      </div>
      <div id="beat-row" class="beat-row"></div>
    </section>

    <!-- Volume mix -->
    <section class="section">
      <div class="ctrl-label">Mix</div>
      <div class="mix-grid">
        <span>Drums</span>
        <input type="range" class="vol-slider" id="drum-vol" min="0" max="1" step="0.01" value="0.8">
        <span>Bass</span>
        <input type="range" class="vol-slider" id="bass-vol" min="0" max="1" step="0.01" value="0.6">
        <span>Guitar</span>
        <input type="range" class="vol-slider" id="chord-vol" min="0" max="1" step="0.01" value="0.5">
      </div>
    </section>

    <!-- Play -->
    <button class="play-btn" id="play-btn">Play</button>

  </main>

  <script src="app.js"></script>
</body>
</html>
